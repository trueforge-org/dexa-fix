codecov:
  require_ci_to_pass: true

coverage:
  precision: 1
  range: "90...100"
  status:
    project:
      default:
        # Every statement is covered by the tests of the three modes together (unit, split,
        # postgres); see .github/instructions/tests.instructions.md. A tenth of a percent of room
        # keeps a rounding difference between the uploads from failing a build.
        target: 100%
        threshold: 0.1%
    patch:
      default:
        target: 75%
        # informational for the first weeks: reports but never fails the check.
        # Remove this line to enforce the patch target.
        informational: true

flags:
  unit:
    carryforward: true
  split:
    carryforward: true
  postgres:
    carryforward: true

ignore:
  - "**/*_test.go"
  - "main.go"

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
