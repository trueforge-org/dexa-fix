{{define "content"}}
<div class="page-head"><h1>DEXA scans</h1></div>
<form method="post" action="/u/{{.User.ID}}/dexa" class="measure card"
      hx-post="/u/{{.User.ID}}/dexa" hx-target="#content" hx-select="#content" hx-swap="outerHTML">
  <div class="section">
    <div class="form-row">
      <label>Date <input type="date" name="measured_at" value="{{.Today}}" required></label>
    </div>
  </div>
  <div class="section">
    <h3>Measurements</h3>
    <div class="grid">
      {{range .Fields}}<label>{{.Label}}{{if .Unit}} ({{.Unit}}){{end}}
        <input type="number" step="any" inputmode="decimal" name="{{.Key}}"></label>{{end}}
    </div>
    <label>Notes <input type="text" name="notes" maxlength="500"></label>
  </div>
  <div class="form-actions"><button type="submit">Add DEXA scan</button></div>
</form>
<section class="card flush">
  <div class="card-head"><h2>Submitted scans</h2></div>
  {{template "table" .}}
</section>
{{end}}
