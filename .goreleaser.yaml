# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: dexafix

before:
  hooks:
    - go mod tidy

builds:
  - id: dexafix
    main: .
    binary: dexafix
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # main.Version is copied to cmd.Version at startup (see main.go)
    ldflags:
      - -s -w -X main.Version={{.Version}}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

sboms:
  - artifacts: archive

# Keyless signing of the checksum file (needs id-token: write and cosign in the workflow).
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"

release:
  prerelease: auto

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Security
      regexp: '^.*?(security|sec)(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Performance
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: Other
      order: 999
  filters:
    exclude:
      - '^docs?(\(.+\))?:'
      - '^test(\(.+\))?:'
      - '^ci(\(.+\))?:'
      - '^chore(\(.+\))?:'
      - "Merge pull request"
