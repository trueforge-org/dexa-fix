# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: dexa-fix

before:
  hooks:
    - go mod tidy

builds:
  - id: dexa-fix
    main: .
    binary: dexa-fix
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # main.Version is copied to cmd.Version at startup (see main.go)
    ldflags:
      - -s -w -X main.Version={{.Version}}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

sboms:
  - artifacts: archive

# Keyless signing of the checksum file (needs id-token: write and cosign in the workflow).
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"

# Keyless signing of the container images and the multi-arch manifest.
docker_signs:
  - cmd: cosign
    artifacts: all
    output: true
    args:
      - sign
      - "--yes"
      - "${artifact}@${digest}"

dockers:
  - id: amd64
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile
    image_templates:
      - "ghcr.io/trueforge-org/dexa-fix:{{ .Version }}-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.source=https://github.com/trueforge-org/dexa-fix"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=AGPL-3.0-only"
  - id: arm64
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile
    image_templates:
      - "ghcr.io/trueforge-org/dexa-fix:{{ .Version }}-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.source=https://github.com/trueforge-org/dexa-fix"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=AGPL-3.0-only"

docker_manifests:
  - name_template: "ghcr.io/trueforge-org/dexa-fix:{{ .Version }}"
    image_templates:
      - "ghcr.io/trueforge-org/dexa-fix:{{ .Version }}-amd64"
      - "ghcr.io/trueforge-org/dexa-fix:{{ .Version }}-arm64"
  - name_template: "ghcr.io/trueforge-org/dexa-fix:{{ .Major }}.{{ .Minor }}"
    skip_push: auto
    image_templates:
      - "ghcr.io/trueforge-org/dexa-fix:{{ .Version }}-amd64"
      - "ghcr.io/trueforge-org/dexa-fix:{{ .Version }}-arm64"
  - name_template: "ghcr.io/trueforge-org/dexa-fix:latest"
    skip_push: auto
    image_templates:
      - "ghcr.io/trueforge-org/dexa-fix:{{ .Version }}-amd64"
      - "ghcr.io/trueforge-org/dexa-fix:{{ .Version }}-arm64"

release:
  prerelease: auto

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Security
      regexp: '^.*?(security|sec)(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Performance
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: Other
      order: 999
  filters:
    exclude:
      - '^docs?(\(.+\))?:'
      - '^test(\(.+\))?:'
      - '^ci(\(.+\))?:'
      - '^chore(\(.+\))?:'
      - "Merge pull request"
