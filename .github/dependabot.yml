version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  # The GoReleaser version used by the Release workflow lives in a Dockerfile that is never built.
  - package-ecosystem: docker
    directory: /.github/goreleaser
    schedule:
      interval: weekly
