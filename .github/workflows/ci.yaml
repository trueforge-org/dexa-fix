---
# CI for DexaFix. Third-party actions are pinned to a major version tag; they can be
# pinned by commit SHA automatically through Renovate (.renovaterc.json5).
name: CI

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # weekly, so new govulncheck advisories surface even without commits
    - cron: "17 5 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep this current. govulncheck carries its own copy of golang.org/x/tools to analyse the code, and
  # an old release panics on newer Go code ("unexpected expr: *ast.KeyValueExpr", exit status 2) in
  # some runs and not in others, so the job failed at random on the same commit. v1.1.4 did that on
  # Go 1.27; v1.9.0 did not fail in 8 runs of 8 where v1.1.4 failed in 4.
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  test:
    name: Test (sqlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: go test
        # -coverpkg=./... counts a line as covered when a test of any package runs it, which is how
        # the browser-level tests in pkg/backend/main cover the frontend and the shared packages.
        run: go test -race -count=1 -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...
      - name: go test (frontend and main backend as two processes)
        # Every browser-level test again, with a frontend that has no database talking over TCP to a
        # separate backend.
        run: go test -race -count=1 -covermode=atomic -coverpkg=./... -coverprofile=coverage-split.out ./pkg/backend/... ./pkg/frontend
        env:
          DEXAFIX_TEST_SPLIT: "1"
      - name: Coverage summary
        if: always() && hashFiles('coverage.out') != ''
        run: |
          {
            echo "### Coverage (sqlite)"
            echo '```'
            go tool cover -func=coverage.out | tail -n 25
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage to Codecov
        if: always() && hashFiles('coverage.out') != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          flags: unit
          fail_ci_if_error: false
      - name: Upload split coverage to Codecov
        if: always() && hashFiles('coverage-split.out') != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-split.out
          flags: split
          fail_ci_if_error: false

  test-postgres:
    name: Test (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          # not "dexafix": the provision tests make that role and set its password, which would
          # lock the tests out if they logged in as it
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dexafix
          POSTGRES_DB: dexafix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dexafix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # every test creates (and drops) its own schema in this database
      DEXAFIX_TEST_POSTGRES_DSN: postgres://postgres:dexafix@localhost:5432/dexafix_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: go test
        run: go test -race -count=1 -covermode=atomic -coverpkg=./... -coverprofile=coverage-postgres.out ./...
      - name: Coverage summary
        if: always() && hashFiles('coverage-postgres.out') != ''
        run: |
          {
            echo "### Coverage (postgres)"
            echo '```'
            go tool cover -func=coverage-postgres.out | tail -n 25
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage to Codecov
        if: always() && hashFiles('coverage-postgres.out') != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-postgres.out
          flags: postgres
          fail_ci_if_error: false

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
      - name: Run govulncheck
        run: govulncheck ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: arm64}
          - {goos: windows, goarch: amd64}
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - name: Build binary
        run: go build -trimpath -o /dev/null .

  goreleaser:
    name: GoReleaser check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: check
      # sbom and signing are skipped: they need syft and an OIDC token
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish,sign,sbom
